name: Marketplace PR checks

"on":
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: marketplace-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-cli:
    name: Python CLI (smoke + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and validate the CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -c "import marketplace_kit; print(marketplace_kit.__version__)"
          marketplace-kit --help
          python -m pytest -q
          python -m ruff check src test scripts
          python scripts/render_readme_inputs.py --check

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:${{ matrix.language }}

  lint:
    name: Lint markdown / yaml / shell / actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lint
        with:
          severity: fail

  check:
    name: Run check against own action.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check
        with:
          action_yml_path: action.yml
          github_token: ${{ github.token }}

  branding:
    name: Render branding preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: branding
        uses: ./.github/actions/branding-preview
        with:
          action_yml_path: action.yml
          output_path: ${{ runner.temp }}/branding-preview.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branding-preview
          path: ${{ steps.branding.outputs.card_path }}
          if-no-files-found: error
